name: Night Market Duel v0.7 Guided Marketplace Acceptance
on:
  push:
    branches: [night-market-duel-v07-staging]
  workflow_dispatch:
jobs:
  full-game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx playwright
      - name: Unit, security, expedition and multiplayer regression
        run: python -m pytest -q
      - name: Check all client scripts
        run: |
          for file in static/app.js static/expedition.js static/expedition-glyphs.js static/expedition-premium.js static/game-vfx.js static/expedition-codex.js; do node --check "$file"; done
      - name: Browser runtime
        run: python -m playwright install --with-deps chromium
      - name: Local staging in GitHub Actions, not user PC or production
        run: |
          mkdir -p evidence
          python -m uvicorn app:app --host 127.0.0.1 --port 3958 > evidence/v07-staging.log 2>&1 &
          python - <<'PY2'
          import urllib.request, time, json
          for _ in range(40):
              try:
                  response=json.load(urllib.request.urlopen('http://127.0.0.1:3958/health',timeout=2))
                  if response['build']=='0.7.0':break
              except Exception:pass
              time.sleep(1)
          else:raise SystemExit('Staging server not healthy')
          PY2
          NMD_BASE=http://127.0.0.1:3958 python tests/browser_guided_v07.py
          NMD_PUBLIC_BASE=http://127.0.0.1:3958 python tests/browser_depth.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: night-market-v07-guided-acceptance
          if-no-files-found: warn
          path: |
            evidence/v07-*.png
            evidence/v07-browser-report.json
            evidence/browser-depth.json
            evidence/staging-v07.log