name: Night Market Duel v0.8 Public HTTPS WSS and UX Acceptance
on:
  push:
    branches: [night-market-duel-release-20261015]
  workflow_dispatch:
jobs:
  public-online-v08:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NMD_BASE: https://night-market-duel-expedition-v07.onrender.com
      NMD_PUBLIC_BASE: https://night-market-duel-expedition-v07.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install -r requirements.txt pytest httpx playwright
      - name: Regression suite
        run: python -m pytest -q
      - name: Wait for live v0.8 visual assets over HTTPS
        run: |
          python - <<'PY'
          import urllib.request,time,json
          base='https://night-market-duel-expedition-v07.onrender.com'
          for i in range(45):
              try:
                  with urllib.request.urlopen(base+'/static/bazaar-theatre-v08.css',timeout=15) as r:
                      content=r.read().decode()
                  with urllib.request.urlopen(base+'/expedition',timeout=15) as r:
                      html=r.read().decode()
                  if '#victoryMarkers' in content and 'bazaar-theatre-v08.js' in html:
                      print('Public v0.8 assets verified over HTTPS');break
              except Exception as e:print('waiting',i,type(e).__name__,str(e)[:120])
              time.sleep(6)
          else:raise SystemExit('Public host did not deploy version v0.8')
          PY
      - name: Two sessions, reconnect and security via public WSS
        run: python tests/public_smoke.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Online 1v1 from distinct browser profiles
        run: python tests/browser_public.py
      - name: Real public HTTPS Expedition and UI desktop/mobile acceptance
        run: |
          python tests/browser_guided_v07.py
          python tests/browser_theatre_v08.py
      - name: Archive proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-market-v08-public-https-wss-evidence
          if-no-files-found: warn
          path: |
            evidence/network-public.json
            evidence/browser-public.json
            evidence/v07-*.png
            evidence/v07-browser-report.json
            evidence-v08/*.png
            evidence-v08/report.json